<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>User Registration</h1>

        <nav>

            <a href="/">Home</a>

            <a href="/register">Register</a>

            <a href="/login">Login</a>

        </nav>

    </header>


    <main class="form-container">

        <h2>Create Your Account</h2>


        <form action="/register" method="POST">


            <label>Name:</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Age:</label>

            <input
                type="number"
                name="age"
                placeholder="Enter your age"
                required
            >


            <label>Date of Birth:</label>

            <input
                type="date"
                name="dob"
                required
            >


            <label>Gender:</label>

            <select name="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>Email:</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Mobile Number:</label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                required
            >


            <label>Username:</label>

            <input
                type="text"
                name="username"
                placeholder="Create username"
                required
            >


            <label>Password:</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >


            <label>Address:</label>

            <textarea
                name="address"
                rows="4"
                placeholder="Enter your address"
                required></textarea>


            <button type="submit">
                Register
            </button>

        </form>


        <p class="bottom-text">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </p>

    </main>

</body>

</html>
