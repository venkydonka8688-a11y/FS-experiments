<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Name Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 650px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 15px gray;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #studentList {
            margin-top: 20px;
        }

        .student {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background-color: #eeeeff;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;

            font-size: 20px;
        }

        .delete-btn {
            background-color: #e05252;
            color: white;
            border: none;
            padding: 9px 15px;
        }

        .delete-btn:hover {
            background-color: #c93636;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Name Manager</h1>

        <div class="input-area">
            <input 
                type="text" 
                id="studentName" 
                placeholder="Enter student name"
            >

            <button onclick="addStudent()">Add Student</button>
        </div>

        <h2>Total Students: <span id="total">0</span></h2>

        <div id="studentList"></div>

    </div>


    <script>

        let students = [];

        function addStudent() {

            let name = document.getElementById("studentName").value;

            if (name.trim() === "") {
                alert("Please enter student name");
                return;
            }

            students.push(name);

            document.getElementById("studentName").value = "";

            displayStudents();
        }


        function displayStudents() {

            let list = document.getElementById("studentList");

            list.innerHTML = "";

            students.forEach(function(student, index) {

                let div = document.createElement("div");

                div.className = "student";

                div.innerHTML =
                    "<span>" + (index + 1) + ". " + student + "</span>" +
                    "<button class='delete-btn' onclick='deleteStudent(" +
                    index +
                    ")'>Delete</button>";

                list.appendChild(div);

            });

            document.getElementById("total").innerText = students.length;
        }


        function deleteStudent(index) {

            students.splice(index, 1);

            displayStudents();

        }

    </script>

</body>
</html>
